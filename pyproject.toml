[project]
name = "trajmem-ot"
version = "0.2.0"
description = "Action-grounded memory-hypothesis branching and trajectory-to-memory transport for VLAs"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
